name: CI

# Every compile and test runs here, on GitHub's runners, never on a developer's machine.

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
          components: rustfmt
      - run: cargo fmt --all -- --check

  rust:
    # The crate is std-only with no platform dependencies, so ubuntu compiles the same code
    # every target would; no OS matrix and no cross-check job this release.
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
          components: clippy
      - run: cargo clippy -p nsh-camera --all-targets -- -D warnings
      - run: cargo test -p nsh-camera --no-fail-fast

  typescript:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install NSH
        env:
          NSH_VERSION: v0.4.0
        run: |
          curl -fsSL https://raw.githubusercontent.com/SuperNSH/nsh-builds/master/install.sh | sh
          echo "$HOME/.nsh/bin" >> "$GITHUB_PATH"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Check
        working-directory: packages/nsh-camera
        run: nsh check
      - name: Build
        working-directory: packages/nsh-camera
        run: nsh build 2>&1 | tee build.log
      - name: Fail on build warnings
        working-directory: packages/nsh-camera
        # Quoted: a plain scalar starting with ! is a YAML tag, not text.
        run: "! grep -i warn build.log"
      - name: Test
        working-directory: packages/nsh-camera
        run: nsh test
